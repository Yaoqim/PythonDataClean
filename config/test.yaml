# 测试环境配置文件

app:
  name: PythonDataClean
  version: "1.0.0"
  run_mode: test
  debug: true

database:
  type: mysql
  host: 47.93.99.161
  port: 3309
  name: aimerchanter_test
  user: ai_test
  password: ${DB_PASSWORD}
  charset: utf8mb4
  pool_size: 5
  pool_overflow: 10
  connect_timeout: 30

file_processing:
  temp_dir: tests/data/temp
  processed_dir: tests/data/processed
  failed_dir: tests/data/failed
  max_file_size_mb: 5000
  supported_formats:
    - json
    - csv
    - jsonl

logging:
  level: WARNING
  format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  dir: tests/logs
  file_max_size_mb: 100
  file_backup_count: 10
  retention_days: 30

api:
  host: "127.0.0.1"
  port: 5001

processing:
  enable_parallel: false
  max_workers: 1
  timeout_seconds: 300

llm:
  enable_cleaning: false
  api_type: openai
  api_timeout: 60
  max_retries: 3

quality:
  score_excellent: 85
  score_good: 70
  score_fair: 50
  missing_rate_core: 0.1
  missing_rate_optional: 0.5

aliyun:
  oss:
    endpoint: https://oss-cn-shanghai.aliyuncs.com
    bucketName: letwx
