# Global
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'data-clean-monitor'

# Alerting
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configs
scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MCP 数据清洗服务指标
  - job_name: 'data_cleaning_service'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL 数据库指标（如果使用 postgres_exporter）
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 15s

  # Redis 缓存指标（如果使用 redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s
